# Sveltia CMS — uređivanje vijesti. Admin: <adresa stranice>/admin/
# Spremanje vijesti radi commit na main, a GitHub Actions zatim objavi stranicu.
backend:
  name: github
  repo: dominiklisica/nk-bibinje
  branch: main
  commit_messages:
    create: 'Vijesti: nova objava „{{slug}}"'
    update: 'Vijesti: izmjena „{{slug}}"'
    delete: 'Vijesti: brisanje „{{slug}}"'

media_folder: public/slike/vijesti
public_folder: /slike/vijesti

collections:
  - name: vijesti
    label: Vijesti
    label_singular: Vijest
    folder: src/content/vijesti
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title, category]
    fields:
      - { name: title, label: Naslov, widget: string }
      - name: date
        label: Datum
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - name: category
        label: Kategorija
        widget: select
        options: [Najava, Obavijest, Izvještaj]
      - name: excerpt
        label: Kratki sažetak
        widget: text
        required: false
      - name: body
        label: Tekst
        widget: text
        hint: Odlomke odvoji praznim retkom.
      - name: matchId
        label: Utakmica
        widget: select
        required: false
        hint: Ako vijest govori o utakmici, ispod nje se prikazuje poveznica na detalje utakmice.
        options:
              - { label: "19.9.2026. NK Bibinje – NK Polača", value: m01 }
